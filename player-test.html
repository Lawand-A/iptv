<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>player-test</title>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar"><div class="topbar-inner">
  <button id="btnMenu" class="icon-btn focusable" data-action="toggle-menu">&#9776;</button>
  <button class="brand focusable">STREAMHUB</button>
  <nav class="topnav" id="topnav">
    <button class="nav-link focusable" data-action="home">Home</button>
    <button class="nav-link focusable" data-action="settings">Settings</button>
  </nav>
</div></header>
<div class="mobile-menu" id="mobileMenu" hidden></div>
<main id="app"></main>
<div id="modalRoot" hidden></div>
<div id="toastRoot"></div>
<div id="focusRing" hidden></div>
<script src="js/storage.js"></script>
<script src="js/m3u-parser.js"></script>
<script src="js/m3u-exporter.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/navigation.js"></script>
<script src="js/app.js"></script>
<script>
  window.__mk = [];
  function run() {
    try {
      var src = "data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28ybXA0MQAAAAhmcmVlAAAAGm1kYXQAAAG5AAAAPw==";
      var item = Store.addItem({ title: "Test Video", type: "movie", mediaType: "direct", source: src, group: "Films" });
      Player.play(item.id);
      var video = document.querySelector("video");
      window.__mk.push("video created: " + !!video);
      window.__mk.push("src set: " + (video && video.src));
      var rect = video ? video.getBoundingClientRect() : null;
      window.__mk.push("video size: " + (rect ? Math.round(rect.width) + "x" + Math.round(rect.height) : "none"));
      var wrap = document.querySelector(".player-wrap");
      window.__mk.push("bar-vol: " + !!document.querySelector(".bar-vol"));
      window.__mk.push("bar-volume: " + !!document.querySelector(".bar-volume"));
      video.addEventListener("loadedmetadata", function () { window.__mk.push("metadata loaded, readyState=" + video.readyState + ", duration=" + video.duration); });
      video.addEventListener("error", function () { window.__mk.push("VIDEO ERROR: " + (video.error ? video.error.code + "/" + video.error.message : "none")); });
      video.addEventListener("playing", function () { window.__mk.push("PLAYING"); });
      setTimeout(function () {
        window.__mk.push("after 6s readyState=" + video.readyState + " paused=" + video.paused + " currentTime=" + Math.round(video.currentTime * 10) / 10);
        var pre = document.createElement("pre");
        pre.id = "results";
        pre.textContent = window.__mk.join("\n");
        document.body.appendChild(pre);
      }, 6000);
    } catch (e) { window.__mk.push("ERR " + e.message); var pre = document.createElement("pre"); pre.id = "results"; pre.textContent = window.__mk.join("\n"); document.body.appendChild(pre); }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
  else run();
</script>
</body>
</html>
