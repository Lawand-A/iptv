<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>imgtest</title>
<link rel="stylesheet" href="css/style.css">
<script>
  try { Object.defineProperty(window, "indexedDB", { value: undefined }); } catch (e) { window.indexedDB = undefined; }
  var items = [
    { id: "b1", title: "Broken Poster Movie", type: "movie", mediaType: "direct", source: "http://example.com/m.mp4", poster: "http://127.0.0.1:1/never.png", group: "Films", description: "" },
    { id: "g1", title: "Good Movie", type: "movie", mediaType: "direct", source: "http://example.com/g.mp4", poster: "", group: "Films", description: "" }
  ];
  localStorage.setItem("iptv_items", JSON.stringify(items));
  window.__errors = [];
  window.onerror = function (msg, src, line, col, err) {
    window.__errors.push((err && err.stack) ? err.stack : msg + " @" + src + ":" + line);
  };
</script>
</head>
<body>
<header id="topbar" class="topbar">
  <div class="topbar-inner">
    <button id="btnMenu" class="icon-btn focusable" aria-label="Open menu" data-action="toggle-menu">&#9776;</button>
    <button class="brand focusable" data-action="home">STREAMHUB</button>
    <nav class="topnav" id="topnav" aria-label="Main">
      <button class="nav-link focusable" data-action="home">Home</button>
      <button class="nav-link focusable" data-action="live">Live</button>
      <button class="nav-link focusable" data-action="movies">Movies</button>
      <button class="nav-link focusable" data-action="series">Series</button>
      <button class="nav-link focusable" data-action="categories">Categories</button>
      <button class="nav-link focusable" data-action="watchlist">Watchlist</button>
      <button class="nav-link focusable" data-action="history">History</button>
      <button class="nav-link focusable" data-action="settings">Library</button>
    </nav>
    <button id="btnRefresh" class="icon-btn focusable" aria-label="Refresh playlist from saved source" data-action="refresh">r</button>
    <button id="btnSearch" class="icon-btn focusable" aria-label="Search" data-action="search">s</button>
  </div>
</header>
<div class="mobile-menu" id="mobileMenu" hidden></div>
<main id="app" tabindex="-1" role="main" class="app"></main>
<div id="modalRoot" class="modal-root" hidden></div>
<div id="toastRoot" class="toast-root"></div>
<div id="focusRing" class="focus-ring" hidden></div>
<script src="js/storage.js"></script>
<script src="js/m3u-parser.js"></script>
<script src="js/m3u-exporter.js"></script>
<script src="js/xtream.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/navigation.js"></script>
<script src="js/app.js"></script>
<script>
  window.addEventListener("load", function () {
    setTimeout(function () {
      try {
        App.navigate("#home");
          setTimeout(function () {
            setTimeout(function () {
              var cards = document.querySelectorAll("#app .card");
              var imgTags = document.querySelectorAll("#app .card img").length;
              var fallbacks = document.querySelectorAll("#app .card .poster-fallback").length;
              var out = document.getElementById("result");
              out.textContent = JSON.stringify({
                cards: cards.length,
                imgTags: imgTags,
                fallbackIcons: fallbacks,
                errors: window.__errors
              }, null, 1);
            }, 3000);
          }, 500);
      } catch (e) {
        var out = document.getElementById("result");
        out.textContent = "EXCEPTION: " + (e && e.stack ? e.stack : e) + "\n" + window.__errors.join("\n");
      }
    }, 400);
  });
</script>
<pre id="result">pending</pre>
</body>
</html>
