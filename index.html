<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>StreamHub — Personal IPTV Library</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StreamHub">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<a class="skip-link" href="#app" data-focus>Skip to content</a>

<header id="topbar" class="topbar">
  <div class="topbar-inner">
    <button id="btnMenu" class="icon-btn focusable" aria-label="Open menu" data-action="toggle-menu">&#9776;</button>
    <button class="brand focusable" data-action="home">STREAMHUB</button>
    <nav class="topnav" id="topnav" aria-label="Main">
      <button class="nav-link focusable" data-action="home">Home</button>
      <button class="nav-link focusable" data-action="live">Live</button>
      <button class="nav-link focusable" data-action="movies">Movies</button>
      <button class="nav-link focusable" data-action="series">Series</button>
      <button class="nav-link focusable" data-action="categories">Categories</button>
      <button class="nav-link focusable" data-action="watchlist">Watchlist</button>
      <button class="nav-link focusable" data-action="history">History</button>
      <button class="nav-link focusable" data-action="settings">Settings</button>
    </nav>
    <button id="btnRefresh" class="icon-btn focusable" aria-label="Refresh playlist from saved source" data-action="refresh"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    <button id="btnSearch" class="icon-btn focusable" aria-label="Search" data-action="search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></button>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu" hidden>
  <button class="nav-link focusable" data-action="home">Home</button>
  <button class="nav-link focusable" data-action="live">Live</button>
  <button class="nav-link focusable" data-action="movies">Movies</button>
  <button class="nav-link focusable" data-action="series">Series</button>
  <button class="nav-link focusable" data-action="categories">Categories</button>
  <button class="nav-link focusable" data-action="watchlist">Watchlist</button>
  <button class="nav-link focusable" data-action="history">History</button>
  <button class="nav-link focusable" data-action="search">Search</button>
  <button class="nav-link focusable" data-action="settings">Settings</button>
</div>

<main id="app" tabindex="-1" role="main" class="app"></main>

<footer id="appFooter" class="app-footer">
  <div class="app-footer-actions">
    <button class="footer-btn" data-footer="clear-history">Clear History</button>
    <button class="footer-btn" data-footer="clear-watchlist">Clear Watchlist</button>
    <button class="footer-btn" data-footer="clear-library">Clear Library</button>
    <button class="footer-btn footer-primary" data-footer="delete-refresh">Delete &amp; Refresh</button>
    <button class="footer-btn footer-danger" data-footer="reset">Reset</button>
  </div>
  <div class="app-footer-donate">
    <a class="footer-btn footer-donate" href="https://www.paypal.com/donate/?hosted_button_id=HCSTDR8W7FD9C" target="_blank" rel="noopener noreferrer">♥ Donate</a>
  </div>
</footer>

<div id="modalRoot" class="modal-root" hidden></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>
<div id="focusRing" class="focus-ring" hidden></div>

<script src="js/storage.js"></script>
<script src="js/m3u-parser.js"></script>
<script src="js/m3u-exporter.js"></script>
<script src="js/xtream.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/navigation.js"></script>
<script src="js/app.js"></script>
<script>
  /* PWA: register the service worker (no-op on file:// or old browsers). */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline support unavailable */ });
    });
  }

  /* PWA: capture the browser install prompt so we can show our own button. */
  window.__pwaInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    window.__pwaInstallPrompt = e;
    document.dispatchEvent(new CustomEvent("pwa-installable"));
  });
  window.addEventListener("appinstalled", function () {
    window.__pwaInstallPrompt = null;
    document.dispatchEvent(new CustomEvent("pwa-installed"));
  });
</script>
</body>
</html>
