<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>perftest</title>
<link rel="stylesheet" href="css/style.css">
<script>
  try { Object.defineProperty(window, "indexedDB", { value: undefined }); } catch (e) { window.indexedDB = undefined; }

  var items = [];
  var nSeries = 600;
  for (var s = 1; s <= nSeries; s++) {
    var sid = "series-" + s;
    items.push({ id: "ep" + s + "-1", title: "Show " + s + " S01E01", type: "episode", seriesId: sid, seriesName: "Show " + s, season: 1, episode: 1, episodeNumber: 1, source: "http://example.com/" + s + "-1.mp4", poster: "", group: "TV" });
    items.push({ id: "ep" + s + "-2", title: "Show " + s + " S01E02", type: "episode", seriesId: sid, seriesName: "Show " + s, season: 1, episode: 2, episodeNumber: 2, source: "http://example.com/" + s + "-2.mp4", poster: "", group: "TV" });
  }
  for (var c = 1; c <= 2200; c++) {
    items.push({ id: "ch" + c, title: "Channel " + c, type: "movie", live: true, mediaType: "direct", source: "http://example.com/live/" + c + ".ts", poster: "", group: "News" });
  }
  for (var m = 1; m <= 400; m++) {
    items.push({ id: "mo" + m, title: "Movie " + m, type: "movie", mediaType: "direct", source: "http://example.com/m" + m + ".mp4", poster: "", group: "Films" });
  }
  localStorage.setItem("iptv_items", JSON.stringify(items));
  localStorage.setItem("iptv_watchlist", JSON.stringify(["cat:Films", "series-series-3"]));
  window.__errors = [];
  window.onerror = function (msg, src, line, col, err) {
    window.__errors.push((err && err.stack) ? err.stack : msg + " @" + src + ":" + line);
  };
</script>
</head>
<body>
<header id="topbar" class="topbar">
  <div class="topbar-inner">
    <button id="btnMenu" class="icon-btn focusable" aria-label="Open menu" data-action="toggle-menu">&#9776;</button>
    <button class="brand focusable" data-action="home">STREAMHUB</button>
    <nav class="topnav" id="topnav" aria-label="Main">
      <button class="nav-link focusable" data-action="home">Home</button>
      <button class="nav-link focusable" data-action="live">Live</button>
      <button class="nav-link focusable" data-action="movies">Movies</button>
      <button class="nav-link focusable" data-action="series">Series</button>
      <button class="nav-link focusable" data-action="categories">Categories</button>
      <button class="nav-link focusable" data-action="watchlist">Watchlist</button>
      <button class="nav-link focusable" data-action="history">History</button>
      <button class="nav-link focusable" data-action="settings">Library</button>
    </nav>
    <button id="btnRefresh" class="icon-btn focusable" aria-label="Refresh playlist from saved source" data-action="refresh">r</button>
    <button id="btnSearch" class="icon-btn focusable" aria-label="Search" data-action="search">s</button>
  </div>
</header>
<div class="mobile-menu" id="mobileMenu" hidden></div>
<main id="app" tabindex="-1" role="main" class="app"></main>
<div id="modalRoot" class="modal-root" hidden></div>
<div id="toastRoot" class="toast-root"></div>
<div id="focusRing" class="focus-ring" hidden></div>
<script src="js/storage.js"></script>
<script src="js/m3u-parser.js"></script>
<script src="js/m3u-exporter.js"></script>
<script src="js/xtream.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/navigation.js"></script>
<script src="js/app.js"></script>
<script>
  var snap = {};
  window.addEventListener("load", function () {
    setTimeout(function () {
      try {
        App.navigate("#home");
        setTimeout(function () {
          snap.homeCards = document.querySelectorAll("#app .card").length;
          snap.homeSeriesRowCards = 0;
          document.querySelectorAll("#app section").forEach(function (sec) {
            var h2 = sec.querySelector(".section-title");
            if (h2 && h2.textContent === "Series") {
              snap.homeSeriesRowCards = sec.querySelectorAll(".card").length;
            }
          });
          snap.homeImgTags = document.querySelectorAll("#app img").length;

          App.navigate("#series");
          setTimeout(function () {
            snap.seriesPageFirstChunk = document.querySelectorAll("#app .card").length;

            App.navigate("#series/series-1");
            setTimeout(function () {
              snap.hasBackdrop = !!document.querySelector(".detail-backdrop");
              snap.detailHeader = !!document.querySelector(".detail-header");
              snap.seriesTitle = document.querySelector(".detail-title") ? document.querySelector(".detail-title").textContent : null;

              App.navigate("#live");
              setTimeout(function () {
                snap.liveRows = document.querySelectorAll("#app .live-item-wrap").length;
                var more = document.querySelector(".live-more");
                snap.liveMoreNote = more ? more.textContent : null;
                var filt = document.querySelector(".live-filter");
                filt.value = "Channel 2";
                filt.dispatchEvent(new Event("input", { bubbles: true }));
                setTimeout(function () {
                  snap.liveFiltered = document.querySelectorAll("#app .live-item-wrap").length;

                  App.navigate("#categories");
                  setTimeout(function () {
                    snap.catCards = document.querySelectorAll("#app .category-card").length;
                    var out = document.getElementById("result");
                    out.textContent = JSON.stringify(snap, null, 1);
                  }, 400);
                }, 300);
              }, 500);
            }, 500);
          }, 500);
        }, 700);
      } catch (e) {
        var out = document.getElementById("result");
        out.textContent = "EXCEPTION: " + (e && e.stack ? e.stack : e) + "\n" + window.__errors.join("\n");
      }
    }, 400);
  });
</script>
<pre id="result">pending</pre>
</body>
</html>
